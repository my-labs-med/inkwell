<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inkwell</title>
    <meta name="description" content="A quiet notebook for things to do." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <main class="page" id="app" aria-live="polite">
      <section class="welcome" id="welcome" hidden>
        <svg class="welcome-drop" aria-hidden="true"><use href="/assets/icons.svg#drop" /></svg>
        <h1>Inkwell</h1>
        <p class="tagline">A quiet notebook for things to do.<br />Write it down. Cross it out. Keep the streak.</p>
        <button class="button" id="sign-in" type="button">Open your journal</button>
      </section>

      <section class="journal" id="journal" hidden>
        <header class="masthead">
          <div class="brand">
            <svg class="brand-drop" aria-hidden="true"><use href="/assets/icons.svg#drop" /></svg>
            <span>Inkwell</span>
          </div>
          <div class="tools">
            <button class="icon-button" id="theme" type="button" aria-label="Switch theme">
              <svg aria-hidden="true"><use href="/assets/icons.svg#moon" /></svg>
            </button>
            <button class="icon-button" id="sign-out" type="button" aria-label="Sign out">
              <svg aria-hidden="true"><use href="/assets/icons.svg#leave" /></svg>
            </button>
          </div>
        </header>

        <div class="dateline">
          <p class="today" id="today"></p>
          <h1 class="greeting" id="greeting">Today's page</h1>
        </div>

        <section class="ledger" aria-label="Your progress">
          <div class="streak">
            <svg class="flame" aria-hidden="true"><use href="/assets/icons.svg#flame" /></svg>
            <div>
              <p class="streak-number" id="streak">0</p>
              <p class="streak-label">day streak</p>
            </div>
          </div>
          <div class="calendar-wrap">
            <div class="calendar" id="calendar" role="img" aria-label="Completions over the last twelve weeks"></div>
            <p class="ledger-foot"><span id="total-done">0</span> done · longest streak <span id="longest">0</span></p>
          </div>
        </section>

        <form class="compose" id="compose" autocomplete="off">
          <label class="visually-hidden" for="new-title">New task</label>
          <input id="new-title" name="title" maxlength="120" placeholder="Write a task, press Enter…" required />
        </form>

        <nav class="tabs" role="tablist" aria-label="Filter tasks">
          <button role="tab" type="button" data-filter="all" aria-selected="true">All <span></span></button>
          <button role="tab" type="button" data-filter="todo" aria-selected="false">To do <span></span></button>
          <button role="tab" type="button" data-filter="doing" aria-selected="false">Doing <span></span></button>
          <button role="tab" type="button" data-filter="done" aria-selected="false">Done <span></span></button>
        </nav>

        <ol class="tasks" id="tasks"></ol>
        <p class="empty" id="empty" hidden>A blank page. Write the first line.</p>
      </section>

      <p class="loading" id="loading">Dipping the pen…</p>
    </main>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <template id="task-template">
      <li class="task">
        <button class="check" type="button">
          <svg class="ring" aria-hidden="true"><use href="/assets/icons.svg#ring" /></svg>
          <svg class="blot" aria-hidden="true"><use href="/assets/icons.svg#blot" /></svg>
        </button>
        <div class="task-body">
          <button class="task-title" type="button"></button>
          <p class="task-notes"></p>
          <form class="task-edit" hidden>
            <input class="edit-title" maxlength="120" required aria-label="Title" />
            <textarea class="edit-notes" maxlength="1000" rows="3" placeholder="Notes" aria-label="Notes"></textarea>
            <div class="edit-actions">
              <button class="button small" type="submit">Save</button>
              <button class="link-button cancel" type="button">Cancel</button>
            </div>
          </form>
        </div>
        <button class="chip" type="button"></button>
        <button class="icon-button delete" type="button">
          <svg aria-hidden="true"><use href="/assets/icons.svg#close" /></svg>
        </button>
      </li>
    </template>
  </body>
</html>
