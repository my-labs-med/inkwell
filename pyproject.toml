[project]
name = "inkwell"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "boto3>=1.35",
    "moto[dynamodb,ses,cognitoidp]>=5.0",
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["source", "source/shared", "source/task-api", "source/stream-processor"]
testpaths = ["source"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["inkwell", "handlers", "stream_processor", "conftest"]
